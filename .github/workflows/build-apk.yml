name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release AntiBacteria APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK & Licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          # Accept licenses on runner pre-installed SDK
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Download Offline Assets
        run: |
          mkdir -p android/app/src/main/assets/www
          # Pre-fetch tailwindcss for 100% standalone offline hospital usage
          curl -fsSL https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js -o android/app/src/main/assets/www/tailwindcss.min.js || true

      - name: Build Android Debug APK
        run: |
          cd android
          gradle wrapper --gradle-version 8.2 || true
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Prepare APK Output
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/AntiBacteria-v1.2.0-Debug.apk
          ls -la dist-apk/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntiBacteria-v1.2.0-Debug-APK
          path: dist-apk/AntiBacteria-v1.2.0-Debug.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.2.0
          name: "AntiBacteria v1.2.0 - Clinical Antimicrobial Guide (APK)"
          body: |
            ## AntiBacteria v1.2.0 - Ứng dụng Kháng sinh Lâm sàng & Tiếng Anh Y khoa

            Bản build Android APK tự động chuẩn The Sanford Guide, Bộ Y tế Việt Nam, BV Chợ Rẫy 2024 và BV Bệnh Nhiệt Đới TPHCM.

            ### 📲 Hướng dẫn cài đặt file APK trên điện thoại:
            1. Tải tệp tin **`AntiBacteria-v1.2.0-Debug.apk`** đính kèm bên dưới.
            2. Nhấn vào file APK vừa tải về trên điện thoại Android.
            3. Nếu thiết bị hỏi *"Cho phép cài đặt từ nguồn này"*, chọn **Bật / Cho phép (Allow)**.
            4. Nhấn **Cài đặt (Install)** và mở ứng dụng.

            ### 🌟 Tính năng nổi bật:
            - **Chuẩn nguồn điều trị:** Sanford Guide 54th, Bộ Y tế VN (QĐ 5631, 7014, 4800), Sách Kháng sinh BV Chợ Rẫy 2024 (NXB Y học), BV Bệnh Nhiệt Đới eMed.
            - **Bảng chỉnh liều thận & Lọc máu:** Colistin (loading 9-12 MIU, duy trì theo CrCl, liều bổ sung HD, liều CRRT 6.5-9 MIU/ngày), Meropenem liều cao truyền kéo dài 3h, Vancomycin TDM.
            - **Phác đồ vi khuẩn đa kháng (XDR/PDR):** CRAB (phác đồ bộ 3 chuẩn Chợ Rẫy: Colistin + Sulbactam liều cao 6-9g/ngày + Meropenem truyền kéo dài), CRKP (NDM vs KPC).
            - **Tương tác & Cảnh báo dược:** Cảnh báo tương tác Meropenem + Valproate, kéo dài khoảng QT, độc thận, phụ nữ mang thai.
            - **Hoạt động Offline 100%:** Sử dụng mượt mà không cần mạng Internet/Wi-Fi trong phòng mổ và khoa Hồi sức cấp cứu (ICU).
          files: dist-apk/AntiBacteria-v1.2.0-Debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
